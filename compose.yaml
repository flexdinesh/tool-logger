services:
  viewer:
    build:
      context: .
      dockerfile: apps/viewer/Dockerfile
    init: true
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    ports:
      - "${VIEWER_BIND_ADDRESS:-127.0.0.1}:${PORT:-4317}:4317"
    # Root can read the logger's private 0700 directory / 0600 files on Linux.
    # The bind mount prevents writes regardless of the container user.
    volumes:
      - type: bind
        source: ${TOOL_LOGGER_STATE_DIR:-${HOME}/.local/state/tool-logger}
        target: /logs
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4317/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
