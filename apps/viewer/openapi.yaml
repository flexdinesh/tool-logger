openapi: 3.1.0
info:
  title: Tool Logger Viewer API
  version: 1.0.0
  description: |
    Read-only REST API for querying append-only tool-call logs.

    Collection results are ordered newest first by `observedAt`, then `id`.
    Cursors are opaque and are valid only with the normalized filters that created
    them. Clients must not parse or construct cursors.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: /
    description: Same-origin viewer server
tags:
  - name: Harnesses
    description: Discovered log producers and their viewer capabilities.
  - name: Tool calls
    description: Search, inspect, and aggregate recorded tool calls.
  - name: Health
    description: Viewer process and log-source diagnostics.
security: []

paths:
  /api/v1/harnesses:
    get:
      operationId: listHarnesses
      tags: [Harnesses]
      summary: List discovered harnesses
      description: |
        Returns readable harness metadata, UI capabilities, and source health.
      parameters:
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Harnesses and their current source health
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HarnessList'
              examples:
                installed:
                  summary: Codex and mixed-generation OpenCode logs
                  value:
                    data:
                      - id: codex
                        label: Codex
                        apiVersions: []
                        capabilities:
                          filters:
                            - id: tool
                              label: Tool
                              type: multi-select
                              queryParameter: tool
                          columns:
                            - id: observedAt
                              label: Time
                              defaultVisible: true
                              sortable: false
                            - id: tool
                              label: Tool
                              defaultVisible: true
                              sortable: false
                          outcomeSemantics:
                            success: Explicit successful result
                            failure: Explicit failed result
                            unknown: Hook completed without a harness outcome
                          detailFields:
                            - id: git
                              label: Git snapshot
                              path: native.attributes.git
                              format: json
                      - id: opencode
                        label: OpenCode
                        apiVersions: [1, 2]
                        capabilities:
                          filters:
                            - id: agent
                              label: Agent
                              type: multi-select
                              queryParameter: agent
                          columns:
                            - id: agentId
                              label: Agent
                              defaultVisible: true
                              sortable: false
                          outcomeSemantics:
                            success: Result reported without an error
                            failure: Result reported with an error
                            unknown: No conclusive result observed
                          detailFields: []
                    sourceHealth:
                      - harness: codex
                        status: healthy
                        apiVersions: []
                        sourceLabel: codex-tool-calls.jsonl
                        skippedRecords: 0
                        lastObservedAt: '2026-09-13T01:42:18.410Z'
                      - harness: opencode
                        status: healthy
                        sourceLabel: opencode-tool-calls.jsonl
                        apiVersions: [1, 2]
                        skippedRecords: 1
                        lastObservedAt: '2026-09-13T01:41:02.004Z'
                    demo: false
        '304':
          $ref: '#/components/responses/NotModified'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/harnesses/{harness}/tool-calls:
    get:
      operationId: listToolCalls
      tags: [Tool calls]
      summary: Query tool calls
      description: |
        Returns compact summaries. Input, output, and native events are available
        from the detail resource. Repeated filter parameters use OR within one
        field and AND across different fields.
      parameters:
        - $ref: '#/components/parameters/Harness'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Lifecycle'
        - $ref: '#/components/parameters/Outcome'
        - $ref: '#/components/parameters/Tool'
        - $ref: '#/components/parameters/Session'
        - $ref: '#/components/parameters/Agent'
        - $ref: '#/components/parameters/Repository'
        - $ref: '#/components/parameters/Directory'
        - $ref: '#/components/parameters/Since'
        - $ref: '#/components/parameters/Until'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Matching tool-call summaries
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolCallPage'
              examples:
                codex:
                  summary: Codex calls
                  value:
                    data:
                      - id: codex:call_01JZQW8BN49WJQ2EHTZKXFJX2K
                        harness: codex
                        harnessApiVersion: null
                        tool: exec_command
                        observedAt: '2026-09-13T01:42:18.410Z'
                        startedAt: '2026-09-13T01:42:18.410Z'
                        finishedAt: '2026-09-13T01:42:18.931Z'
                        lifecycle: finished
                        outcome: unknown
                        durationMs: 521
                        sessionId: 01JZQVXEPYRQ7NYW2K6T7RPDMT
                        agentId: null
                        directory: /home/dee/workspace/tool-logger/main
                        repository: /home/dee/workspace/tool-logger/main
                        inputSummary: pnpm check
                        attributes:
                          turnId: 17
                    page:
                      nextCursor: eyJvYnNlcnZlZEF0IjoiMjAyNi0wOS0xM1QwMTo0MjoxOC40MTBaIiwiaWQiOiJjb2RleCJ9
                      hasMore: true
                    sourceHealth:
                      harness: codex
                      status: healthy
                      apiVersions: []
                      sourceLabel: codex-tool-calls.jsonl
                      skippedRecords: 0
                      lastObservedAt: '2026-09-13T01:42:18.931Z'
                opencode:
                  summary: OpenCode V2 result
                  value:
                    data:
                      - id: opencode:tool_01JZQWFF32X8TDN7TTEZ7VK4N2
                        harness: opencode
                        harnessApiVersion: 2
                        tool: bash
                        observedAt: '2026-09-13T01:41:02.004Z'
                        startedAt: '2026-09-13T01:41:01.230Z'
                        finishedAt: '2026-09-13T01:41:02.004Z'
                        lifecycle: finished
                        outcome: success
                        durationMs: 774
                        sessionId: ses_01JZQW9K8F6JV3TTGVTAVS62EF
                        agentId: build
                        directory: /work/project
                        repository: /work/project
                        inputSummary: pnpm check
                        attributes:
                          title: Run tests
                    page:
                      nextCursor: null
                      hasMore: false
                    sourceHealth:
                      harness: opencode
                      status: healthy
                      sourceLabel: opencode-tool-calls.jsonl
                      apiVersions: [1, 2]
                      skippedRecords: 0
                      lastObservedAt: '2026-09-13T01:41:02.004Z'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalError'
        default:
          $ref: '#/components/responses/Problem'

  /api/v1/harnesses/{harness}/tool-calls/{callId}:
    get:
      operationId: getToolCall
      tags: [Tool calls]
      summary: Get tool-call detail
      description: Returns projected fields plus the unmodified harness-native records.
      parameters:
        - $ref: '#/components/parameters/Harness'
        - $ref: '#/components/parameters/CallId'
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Tool-call detail
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolCallDetail'
              examples:
                codex:
                  summary: Codex call with native pre/post records
                  value:
                    summary:
                      id: codex:call_01JZQW8BN49WJQ2EHTZKXFJX2K
                      harness: codex
                      harnessApiVersion: null
                      tool: exec_command
                      observedAt: '2026-09-13T01:42:18.410Z'
                      startedAt: '2026-09-13T01:42:18.410Z'
                      finishedAt: '2026-09-13T01:42:18.931Z'
                      lifecycle: finished
                      outcome: unknown
                      durationMs: 521
                      sessionId: 01JZQVXEPYRQ7NYW2K6T7RPDMT
                      agentId: null
                      directory: /home/dee/workspace/tool-logger/main
                      repository: /home/dee/workspace/tool-logger/main
                      inputSummary: pnpm check
                      attributes:
                        turnId: 17
                    input:
                      cmd: pnpm check
                    output:
                      output: 43 tests passed
                      exit_code: 0
                    native:
                      attributes:
                        correlationId: call_01JZQW8BN49WJQ2EHTZKXFJX2K
                      events:
                        - schema_version: 1
                          logged_at: '2026-09-13T01:42:18.410Z'
                          harness: codex
                          hook: PreToolUse
                          event:
                            tool_name: exec_command
                            tool_input:
                              cmd: pnpm check
                        - schema_version: 1
                          logged_at: '2026-09-13T01:42:18.931Z'
                          harness: codex
                          hook: PostToolUse
                          event:
                            tool_name: exec_command
                            tool_output:
                              output: 43 tests passed
                              exit_code: 0
                opencodeLegacy:
                  summary: Legacy OpenCode V1 call preserved alongside V2 data
                  value:
                    summary:
                      id: opencode:legacy:10482
                      harness: opencode
                      harnessApiVersion: 1
                      tool: bash
                      observedAt: '2026-09-12T23:11:30.115Z'
                      startedAt: '2026-09-12T23:11:30.115Z'
                      finishedAt: null
                      lifecycle: awaiting
                      outcome: unknown
                      durationMs: null
                      sessionId: ses_legacy
                      agentId: null
                      directory: /work/legacy
                      repository: null
                      inputSummary: git status --short
                      attributes: {}
                    input:
                      command: git status --short
                    output: null
                    native:
                      attributes:
                        sourceGeneration: v1
                      events:
                        - api_version: 1
                          logged_at: '2026-09-12T23:11:30.115Z'
