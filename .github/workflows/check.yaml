name: Check
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: pnpm
      - name: Linux webview display dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-0 libayatana-appindicator3-dev xvfb
      - run: pnpm install --frozen-lockfile
      - name: Headless browser dependencies
        run: pnpm --filter @tool-logger/web exec playwright install --with-deps chromium
      - run: pnpm check
      - run: pnpm --filter @tool-logger/web test:browser
      - name: Linux native process automation
        if: runner.os == 'Linux'
        run: xvfb-run -a pnpm --filter @tool-logger/desktop test:e2e
      - name: macOS native process automation
        if: runner.os == 'macOS'
        run: pnpm --filter @tool-logger/desktop test:e2e
      - run: pnpm --filter @tool-logger/desktop build
      - uses: actions/upload-artifact@v4
        with:
          name: tool-logger-${{ runner.os }}
          path: apps/desktop/build/
